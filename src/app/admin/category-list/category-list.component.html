<div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-50 flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-900">Categories</h3>
        <a routerLink="add-category" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">Add Category</a>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                <tr>
                    <th class="px-6 py-3 font-semibold">Category ID</th>
                    <th class="px-6 py-3 font-semibold">Category Name</th>
                    <th class="px-6 py-3 font-semibold text-center">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                @for(category of categories; track category) {
                    <tr class="hover:bg-slate-50/50 transition-colors">
                        <td class="px-6 py-4 font-medium text-slate-900">{{ category.id }}</td>
                        <td class="px-6 py-4 text-slate-600">{{ category.name }}</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2 justify-center">
                                <button [routerLink]="['/admin/categories/edit-category', category.id]" class="w-10 h-10 rounded-full flex items-center justify-center bg-green-50 border border-green-500 text-green-600">
                                    <i class="fa-regular fa-pen-to-square"></i>
                                </button>
                                <button (click)="deleteCategory(category)" class="w-10 h-10 rounded-full flex items-center justify-center bg-red-50 border border-red-500 text-red-600">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
