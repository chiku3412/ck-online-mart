<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="flex items-center justify-between p-5 border-b border-slate-200">
        <h2 class="text-xl font-semibold text-slate-800">
            Categories
        </h2>
        <a routerLink="add-category" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
            Add Category
        </a>
    </div>
</div>

<div class="overflow-x-auto overflow-y-auto max-h-[75vh] mt-7 rounded-2xl">
    <table mat-table [dataSource]="categories" class="min-w-[2500px] w-full">
        <!-- Category ID -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Category ID
                </span>
            </th>
            <td mat-cell *matCellDef="let category">
                <span class="text-sm text-slate-600 font-semibold">
                    {{ category.id }}
                </span>
            </td>
        </ng-container>

        <!-- Category Name -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Category Name
                </span>
            </th>
            <td mat-cell *matCellDef="let category">
                <span class="text-sm text-slate-600 font-semibold">
                    {{ category.name }}
                </span>
            </td>
        </ng-container>

        <!-- Action -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold flex justify-center">
                    Action
                </span>
            </th>
            <td mat-cell *matCellDef="let category">
                <div class="flex items-center gap-2 justify-center">
                    <button [routerLink]="['/admin/categories/edit-category', category.id]" class="w-10 h-10 rounded-full flex items-center justify-center bg-green-50 border border-green-500 text-green-600">
                        <i class="fa-regular fa-pen-to-square"></i>
                    </button>
                    <button (click)="deleteCategory(category)" class="w-10 h-10 rounded-full flex items-center justify-center bg-red-50 border border-red-500 text-red-600">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </td>
        </ng-container>

        <!-- Header -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <!-- Rows -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
