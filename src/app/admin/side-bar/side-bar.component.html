<!-- Mobile Overlay -->
@if(isSidebarOpen) {
    <div class="fixed inset-0 bg-black/40 z-40 lg:hidden backdrop-blur-sm" (click)="toggleSidebar()"></div>
}

<!-- Sidebar -->
<aside class="fixed top-0 left-0 z-50 h-full w-64 bg-white border-r border-slate-200 transition-transform duration-300 lg:translate-x-0" [class.-translate-x-full]="!isSidebarOpen" [class.translate-x-0]="isSidebarOpen">
    <!-- Logo -->
    <div class="h-16 flex items-center px-6 border-b border-slate-100">
        <span class="text-lg font-bold text-slate-900 tracking-tight">Online Store <span class="text-indigo-600">Admin</span></span>
        <button (click)="toggleSidebar()" class="ml-auto lg:hidden w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto custom-scroll py-4 px-3 space-y-1 h-[calc(100vh-160px)]">
        <p class="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 mt-2">Main</p>
        @for(item of sideBarLinks; track item) {
            <a [routerLink]="item.route" class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900">
                <i class="{{ item.icons }} w-5 text-center"></i>
                {{ item.name }}
            </a>
        }
    </nav>

    <!-- User Card -->
    <div class="p-4 border-t border-slate-100">
        <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 hover:bg-slate-100 transition-colors cursor-pointer">
            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop" class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm">
            <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-slate-900 truncate">Alex Morgan</p>
                <p class="text-xs text-slate-500 truncate">Super Admin</p>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
        </div>
    </div>
</aside>
