<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="flex items-center justify-between p-5 border-b border-slate-200">
        <h2 class="text-xl font-semibold text-slate-800">
            Total Products
        </h2>
        <a routerLink="add-product" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">Add Product</a>
    </div>
</div>

<div class="bg-white rounded-xl border border-slate-100 mt-7 shadow-sm overflow-hidden">
    <table mat-table [dataSource]="products" class="w-full">
        <!-- Product ID -->
        <ng-container matColumnDef="productId">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Product ID
                </span>
            </th>
            <td mat-cell *matCellDef="let productItem">
                <span class="font-medium text-slate-900">
                    {{ productItem.productId }}
                </span>
            </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Name
                </span>
            </th>
            <td mat-cell *matCellDef="let productItem">
                <div class="flex gap-2 items-center">
                    <div class="w-10 h-10 rounded overflow-hidden shrink-0">
                        <img [src]="'http://localhost:5000' + productItem.image" [alt]="productItem.name" class="w-full h-full object-cover">
                    </div>
                    <span class="font-medium text-slate-900">
                        {{ productItem.name }}
                    </span>
                </div>
            </td>
        </ng-container>

        <!-- Category -->
        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Category
                </span>
            </th>
            <td mat-cell *matCellDef="let productItem">
                <span class="font-medium text-slate-900">
                    {{ productItem.category }}
                </span>
            </td>
        </ng-container>

        <!-- Old Price -->
        <ng-container matColumnDef="oldPrice">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Old Price
                </span>
            </th>
            <td mat-cell *matCellDef="let productItem">
                <span class="font-medium text-slate-900">
                    ₹ {{ productItem.oldPrice }}
                </span>
            </td>
        </ng-container>

        <!-- Price -->
        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Price
                </span>
            </th>
            <td mat-cell *matCellDef="let productItem">
                <span class="font-medium text-slate-900">
                    ₹ {{ productItem.price }}
                </span>
            </td>
        </ng-container>

        <!-- Stock -->
        <ng-container matColumnDef="stock">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Stock
                </span>
            </th>
            <td mat-cell *matCellDef="let productItem">
                <span class="font-medium text-slate-900">
                    {{ productItem.stock }}
                </span>
            </td>
        </ng-container>

        <!-- Action -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Action
                </span>
            </th>
            <td mat-cell *matCellDef="let productItem">
                <div class="flex items-center gap-2 justify-center">
                    <button type="button" [routerLink]="[ '/admin/products/edit-product', productItem.id ]" class="w-10 h-10 rounded-full flex items-center justify-center bg-green-50 border border-green-500 text-green-600">
                        <i class="fa-regular fa-pen-to-square"></i>
                    </button>
                    <button type="button" (click)="deleteProduct(productItem)" class="w-10 h-10 rounded-full flex items-center justify-center bg-red-50 border border-red-500 text-red-600">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
