<header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 h-16">
    <div class="h-full px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
        <!-- Left: Toggle + Search -->
        <div class="flex items-center gap-4 flex-1">
            <button (click)="toggleSidebar()" class="lg:hidden w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Search -->
            <div class="hidden sm:flex items-center max-w-md flex-1 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-400 text-sm"></i>
                <input type="text" placeholder="Search products, orders, customers..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 outline-none focus:bg-white focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 transition-all">
            </div>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Mobile Search Toggle -->
            <button class="sm:hidden w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition-colors">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>

            <!-- Notifications -->
            <div class="relative">
                <button (click)="toggleDropdown('notifDropdown')" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition-colors relative">
                    <i class="fa-regular fa-bell text-lg"></i>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                </button>

                <!-- Notification Dropdown -->
                <div id="notifDropdown" class="dropdown-menu hidden absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-50">
                    <div class="px-4 py-2 border-b border-slate-50 flex items-center justify-between">
                        <h3 class="text-sm font-bold text-slate-900">Notifications</h3>
                        <span class="text-[10px] bg-indigo-50 text-indigo-600 font-bold px-2 py-0.5 rounded-full">
                            3 New
                        </span>
                    </div>
                    <div class="max-h-64 overflow-y-auto custom-scroll">
                        <a href="#" class="flex gap-3 px-4 py-3 hover:bg-slate-50 transition-colors">
                            <div class="w-8 h-8 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 flex-shrink-0">
                                <i class="fa-solid fa-bag-shopping text-xs"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-slate-900">New order received</p>
                                <p class="text-[11px] text-slate-500 mt-0.5">Order #ORD-7829 — ₹2,499</p>
                                <p class="text-[10px] text-slate-400 mt-1">2 min ago</p>
                            </div>
                        </a>
                        <a href="#" class="flex gap-3 px-4 py-3 hover:bg-slate-50 transition-colors">
                            <div class="w-8 h-8 bg-amber-50 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0">
                                <i class="fa-solid fa-star text-xs"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-slate-900">New review</p>
                                <p class="text-[11px] text-slate-500 mt-0.5">iPhone 16 Pro Max — 5 stars</p>
                                <p class="text-[10px] text-slate-400 mt-1">15 min ago</p>
                            </div>
                        </a>
                        <a href="#" class="flex gap-3 px-4 py-3 hover:bg-slate-50 transition-colors">
                            <div class="w-8 h-8 bg-red-50 rounded-full flex items-center justify-center text-red-600 flex-shrink-0">
                                <i class="fa-solid fa-circle-exclamation text-xs"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-slate-900">Low stock alert</p>
                                <p class="text-[11px] text-slate-500 mt-0.5">Sony WH-1000XM5 — Only 3 left</p>
                                <p class="text-[10px] text-slate-400 mt-1">1 hour ago</p>
                            </div>
                        </a>
                    </div>
                    <div class="px-4 py-2 border-t border-slate-50 text-center">
                        <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">View All</a>
                    </div>
                </div>
            </div>

            <!-- Messages -->
            <button class="hidden sm:flex w-9 h-9 items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition-colors relative">
                <i class="fa-regular fa-envelope text-lg"></i>
                <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full border-2 border-white"></span>
            </button>

            <!-- Profile -->
            <div class="relative">
                <button (click)="toggleDropdown('profileDropdown')" class="flex items-center gap-2 pl-1 pr-2 py-1 rounded-full hover:bg-slate-100 transition-colors">
                    <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop" class="w-8 h-8 rounded-full object-cover border border-slate-200">
                    <div class="hidden md:block text-left">
                        <p class="text-xs font-semibold text-slate-900 leading-tight">Alex Morgan</p>
                        <p class="text-[10px] text-slate-500 leading-tight">Admin</p>
                    </div>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 ml-1 hidden md:block"></i>
                </button>

                <!-- Profile Dropdown -->
                <div id="profileDropdown" class="dropdown-menu hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-50">
                    <div class="px-4 py-3 border-b border-slate-50">
                        <p class="text-sm font-bold text-slate-900">Alex Morgan</p>
                        <p class="text-xs text-slate-500">alex&#64;abc.com</p>
                    </div>
                    <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                        <i class="fa-regular fa-user w-4"></i> Profile
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                        <i class="fa-solid fa-gear w-4"></i> Settings
                    </a>
                    <div class="border-t border-slate-50 mt-1 pt-1">
                        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                            <i class="fa-solid fa-arrow-right-from-bracket w-4"></i> Sign Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
