<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="flex items-center justify-between p-5 border-b border-slate-200">
        <h2 class="text-xl font-semibold text-slate-800">
            Contacts
        </h2>
    </div>
</div>

<div class="bg-white rounded-xl border border-slate-100 mt-7 shadow-sm overflow-hidden">
    <table mat-table [dataSource]="contacts" class="w-full">
        <!-- Contact ID -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Contact ID
                </span>
            </th>
            <td mat-cell *matCellDef="let contact" class="font-medium">
                <span class="text-sm text-slate-600 font-semibold">
                    {{ contact.id }}
                </span>
            </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Name
                </span>
            </th>
            <td mat-cell *matCellDef="let contact">
                <span class="text-sm text-slate-600 font-semibold">
                    {{ contact.name }}
                </span>
            </td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Email
                </span>
            </th>
            <td mat-cell *matCellDef="let contact">
                <span class="text-sm text-slate-600 font-semibold">
                    {{ contact.email }}
                </span>
            </td>
        </ng-container>

        <!-- Subject -->
        <ng-container matColumnDef="subject">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Subject
                </span>
            </th>
            <td mat-cell *matCellDef="let contact">
                <span class="text-sm text-slate-600 font-semibold">
                    {{ contact.subject }}
                </span>
            </td>
        </ng-container>

        <!-- Message -->
        <ng-container matColumnDef="message">
            <th mat-header-cell *matHeaderCellDef>
                <span class="font-semibold">
                    Message
                </span>
            </th>
            <td mat-cell *matCellDef="let contact">
                <span class="text-sm text-slate-600 font-semibold max-w-80 line-clamp-2">
                    {{ contact.message }}
                </span>
            </td>
        </ng-container>

        <!-- Action -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-center">
                <span class="font-semibold flex justify-center">
                    Action
                </span>
            </th>
            <td mat-cell *matCellDef="let contact">
                <div class="flex items-center gap-2 justify-center">
                    <button type="button" class="w-10 h-10 rounded-full flex items-center justify-center bg-red-50 border border-red-500 text-red-600">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
