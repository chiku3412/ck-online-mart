<aside class="bg-white rounded-md shadow-sm border border-gray-100 overflow-hidden">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
        <h2 class="text-base font-bold text-gray-900">Filters</h2>
        <button class="text-xs font-semibold text-teal-700 hover:text-teal-800 transition-colors">
            Reset All
        </button>
    </div>
    <div class="max-h-[calc(100vh-120px)] overflow-y-auto custom-scroll pb-4">
        <!-- Price Range -->
        <div class="px-6 py-5 border-b border-gray-50">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-gray-800">Price Range</h3>
                <i class="fa-regular fa-angle-down text-gray-400"></i>
            </div>
            <div class="range-slider mb-4 relative h-1 bg-[#e2e8f0] rounded-sm">
                <div class="range-selected absolute h-full bg-green-600 rounded-sm" [style.left.%]="rangeLeft" [style.width.%]="rangeWidth"></div>
                <input class="absolute w-full h-1 bg-transparent pointer-events-none top-0 appearance-none" type="range" [min]="minPrice" [max]="maxPrice" [(ngModel)]="selectedMinPrice" (input)="onMinChange()">
                <input class="absolute w-full h-1 bg-transparent pointer-events-none top-0 appearance-none" type="range" [min]="minPrice" [max]="maxPrice" [(ngModel)]="selectedMaxPrice" (input)="onMaxChange()">
            </div>
            <div class="flex items-center justify-between gap-3">
                <div class="flex-1 relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">₹</span>
                    <input type="number" [(ngModel)]="selectedMinPrice" (input)="onMinChange()" class="w-full pl-7 pr-3 py-2 text-sm font-semibold text-gray-700 bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-teal-500 transition-colors">
                </div>
                <span class="text-gray-300 font-medium">-</span>
                <div class="flex-1 relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">₹</span>
                    <input type="number" [(ngModel)]="selectedMaxPrice" (input)="onMaxChange()" class="w-full pl-7 pr-3 py-2 text-sm font-semibold text-gray-700 bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-teal-500 transition-colors">
                </div>
            </div>
        </div>

        <!-- Categories -->
        <div class="px-6 py-5 border-b border-gray-50">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-gray-800">Categories</h3>
                <i class="fa-regular fa-angle-down text-gray-400"></i>
            </div>
            <div class="space-y-2.5">
                @for(category of categories; track category) {
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" class="custom-checkbox">
                        <span class="text-sm text-gray-600 group-hover:text-gray-900 transition-colors">{{ category.category }}</span>
                        <span class="ml-auto text-xs font-medium text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">{{ category.total }}</span>
                    </label>
                }
            </div>
        </div>
    </div>

    <!-- Sticky Footer -->
    <div class="sticky bottom-0 bg-white border-t border-gray-100 px-6 py-4 flex gap-3">
        <button class="flex-1 py-2.5 text-sm font-semibold text-gray-600 bg-gray-100 rounded-xl hover:bg-black hover:text-white transition-colors duration-500">
            Clear
        </button>
        <button class="flex-1 py-2.5 text-sm font-bold text-white bg-black rounded-xl border border-black hover:bg-transparent hover:text-black transition-all duration-500">
            Apply Filters
        </button>
    </div>
</aside>
